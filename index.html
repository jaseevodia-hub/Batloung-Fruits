
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Batloung Fruits Distribution Management System for managing fruits, suppliers, stock, vendors and orders."
    />
    <title>Batloung Fruits | Distribution Management System</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("batloung-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          document.documentElement.dataset.theme =
            stored || (prefersDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
